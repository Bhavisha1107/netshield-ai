services:
  postgres:
    image: postgres:16
    container_name: netshield_postgres
    restart: always
    environment:
      POSTGRES_USER: netshield_user
      POSTGRES_PASSWORD: netshield_pass
      POSTGRES_DB: netshield
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  mongo:
    image: mongo:7
    container_name: netshield_mongo
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - mongodata:/data/db

volumes:
  pgdata:
  mongodata:
